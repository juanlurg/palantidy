services:
  palantidy:
    build: .
    container_name: palantidy
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - PALANTIDY_HOST=0.0.0.0
      - PALANTIDY_PORT=7000
      - PALANTIDY_DB_PATH=/app/data/moria.db
      - SYNC_INTERVAL_HOURS=12     # Checks for new movies/episodes every 12 hours
    volumes:
      - ./data:/app/data

  # Cloudflare Tunnel: Gives Palantidy an official, secure HTTPS URL (No port forwarding or SSL setup needed)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: palantidy-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://palantidy:7000
